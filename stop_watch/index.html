<!DOCTYPE html>
<html>
    <head>
        <title>
            Stop-Watch
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="stop-watch head">
            <div class="heading">
                <p>Stop Watch</p>
            </div>
            <div id="display" class="stop-display">
                Start timer
                
            </div>
            <div class="stop-buttons">
                <button id="start-btn" class="box">Start</button>
                <button id="pause-btn" class="box">Pause</button>
                <button id="reset-btn" class="box">Reset</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>

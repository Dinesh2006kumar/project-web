<!DOCTYPE html>
<html>
    <head>
        <title>CALC</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="cal-outer">
            <div class="cal-header">
                <p>CALCII</p>
            </div>
            <div class="cal-mid">
                 <p id="result">The result</p> 
            </div>
            <div class="cal-in">
                <button class="box" id="a0">0</button>
                <button class="box" id="a1">1</button>
                <button class="box" id="a2">2</button>
                <button class="box" id="a3">3</button>
                <button class="box" id="a4">4</button>
                <button class="box" id="a5">5</button>
                <button class="box" id="a6">6</button>
                <button class="box" id="a7">7</button>
                <button class="box" id="a8">8</button>
                <button class="box" id="a9">9</button>
                <button class="box" id="equal">==</button>
                <button class="box" id="cls">clear</button>
            </div>
            <div class="cal-ope">
                <button class="opp" id="a+">+</button>
                <button class="opp" id="a-">-</button>
                <button class="opp" id="a*">*</button>
                <button class="opp" id="a/">/</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>

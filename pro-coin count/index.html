<!DOCTYPE html>
<html>
    <head>
        <title>
            Head & Tail
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="body">
            <div class="div-header bor">
                <p>Head and Tail Counter</p>
            </div>
            <div class="div-coin bor">
                <p id="result">Toss the coin</p>
            </div>
            <div class="div-result bor">
                <div class="head counter">
                    <p>Head count</p>
                    <div id="heads" class="box">0</div>
                </div>
                <div class="tail counter">
                    <p>tail count</p>
                    <div id="tails" class="box">0</div>
                </div>
            </div>
            <div class="menu bor">
                <button id="reset">Reset</button>
                <button id="Guess">Guess</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
